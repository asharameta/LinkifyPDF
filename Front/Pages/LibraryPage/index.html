<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library — LinkifyPDF</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/LibraryPage/style.css">
    <script src="/JS/LibraryPage/script.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

<div class="liquid-bg"></div>

<header class="header">
  <div class="header-container">
    <h1 class="logo">LinkifyPDF</h1>
    <nav class="nav">
      <ul class="nav-list">
        <li><a class="glass-link" href="/Pages/HomePage">Linkify PDF</a></li>
        <li><a class="glass-link active" href="/Pages/LibraryPage">My Library</a></li>
        <li><a class="glass-link" href="/Pages/OptimizerPage">PDF Optimizer</a></li>
      </ul>
    </nav>
  </div>
</header>

<div id="error-banner" class="error-banner" style="display:none;"></div>

<div class="library-layout">

  <aside class="doc-list-panel">
    <h2 class="panel-title">Your Documents</h2>
    <div id="doc-list">
      <div class="spinner" id="list-spinner"></div>
    </div>
  </aside>

  <main class="doc-preview-panel">
    <div class="preview-empty" id="preview-empty">
      <div class="empty-icon">📄</div>
      <p>Select a document from the list to preview it</p>
    </div>

    <div class="preview-content" id="preview-content" style="display:none;">
      <div class="doc-actions">
        <span class="doc-filename" id="preview-filename"></span>
        <div class="action-buttons">
          <button class="btn btn-edit" id="edit-btn">Edit</button>
          <button class="btn btn-download" id="download-btn">Download</button>
          <button class="btn btn-delete" id="delete-btn">Delete</button>
        </div>
      </div>
      <div class="pdf-wrapper" id="pdf-wrapper">
        <div class="spinner" id="preview-spinner" style="display:none;"></div>
        <canvas id="pdfCanvas"></canvas>
        <div id="overlay"></div>
      </div>
    </div>
  </main>

</div>

</body>
</html>
